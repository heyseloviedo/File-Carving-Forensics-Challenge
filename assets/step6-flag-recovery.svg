<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<rect width="1280" height="720" rx="18" fill="#0d1117"/>
<rect width="1280" height="54" rx="18" fill="#161b22"/>
<circle cx="28" cy="27" r="8" fill="#ff5f56"/><circle cx="54" cy="27" r="8" fill="#ffbd2e"/><circle cx="80" cy="27" r="8" fill="#27c93f"/>
<text x="105" y="34" fill="#c9d1d9" font-family="monospace" font-size="18">Kali Linux — archive extraction</text>
<g fill="#c9d1d9" font-family="monospace" font-size="22">
<text x="42" y="108">$ gunzip -c hidden.gz &gt; hidden</text>
<text x="42" y="154">$ file hidden</text>
<text x="42" y="194">hidden: POSIX tar archive (GNU)</text>
<text x="42" y="250">$ tar -tf hidden</text>
<text x="42" y="290">flags/</text>
<text x="42" y="330">flags/flags.txt</text>
<text x="42" y="386">$ tar -xf hidden</text>
<text x="42" y="430">$ cat flags/flags.txt</text>
<text x="42" y="482" fill="#3fb950">[challenge flag recovered]</text>
</g>
<text x="42" y="548" fill="#58a6ff" font-family="monospace" font-size="22">Recovered path: green_file → gzip → TAR → flags/flags.txt</text>
</svg>